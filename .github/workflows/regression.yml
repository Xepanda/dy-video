name: 素材回归门禁 (Material Regression Gate)

# B16 落地：CI 全绿才允许合入。
# 两层：
#   unit     —— 单元测试层（价格检测/黑名单精度/OCR 纯净度/决策网关/时间线桥接/
#                LLM 审核/管道单测）。GitHub 托管 runner 即可跑，无需直播素材。
#   material —— 素材端到端层（4 条新素材 + demo 全量跑通 + 指标区间锁定）。
#                需要直播原始素材（未入库），在带素材的自托管 runner 上跑，
#                默认由 workflow_dispatch 或打了 run-material-regression 标签的 PR 触发。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      force_material:
        description: "强制跑素材层（需要自托管 runner 与本地素材）"
        type: boolean
        default: false

jobs:
  unit:
    name: 单元测试层
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行单元测试层回归
        run: python -u scripts/run_regression.py --quick

  material:
    name: 素材端到端层
    # 需要直播原始素材（data/raw_samples 下 6/7/8/9 号 + demo，体积大不入库）
    runs-on: [self-hosted, windows]
    timeout-minutes: 180
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-material-regression')
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 全量回归（单元 + 素材端到端 + 指标区间锁定）
        run: python -u scripts/run_regression.py

      - name: 上传回归报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: |
            logs/regression_report.json
            logs/batch_report.json
            output/*/qc_report.json
            output/*/agent_decision_manifest.json
