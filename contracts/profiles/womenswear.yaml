  - "精梳棉"
  - "三防"
  - "防水"
  - "防风"
  - "羊绒"
  - "羊毛"
  - "德绒"

# 子品类细化规则（口播扩展词 + ROI 躯干区域策略）
subcategories:
  knitwear:
    match_terms: ["针织", "毛衣", "衫", "上衣", "打底", "开衫", "卫衣", "T恤", "衬衫"]
    synonym_tokens: ["毛衣", "针织", "大毛衫", "线衫", "羊毛衫", "开衫", "打底", "上衣", "纱线", "面料", "手感", "版型", "领形", "领口", "正肩", "落肩"]
    roi_region: upper_torso   # 肩 -> 髋
  outerwear:
    match_terms: ["外套", "大衣", "风衣", "羽绒", "棉服", "夹克", "西装", "马甲", "皮草"]
    synonym_tokens: ["外套", "大衣", "风衣", "羽绒服", "棉服", "西装", "马甲", "版型", "面料", "门襟", "扣子", "保暖", "挺括", "领口"]
    roi_region: upper_torso_extended  # 肩 -> 大腿上段
  dress:
    match_terms: ["裙", "连衣裙", "半身裙", "长裙", "短裙"]
    synonym_tokens: ["裙子", "连衣裙", "半身裙", "裙摆", "下摆", "腰线", "垂坠", "显高", "显瘦"]
    roi_region: full_body_dress       # 肩 -> 膝
  pants:
    match_terms: ["裤", "阔腿", "西裤", "牛仔裤", "休闲裤", "长裤"]
    synonym_tokens: ["裤子", "西裤", "裤腿", "阔腿裤", "垂坠", "腰头", "显腿长", "裤型"]
    roi_region: lower_body            # 髋 -> 踝

# Director Brief 漏斗配额默认配置（用于 797 -> Top 40~60 压缩）
director_brief:
  max_featured_candidates: 54
  max_gray_zone_candidates: 12
  role_quotas:
    HOOK: 10
    FABRIC: 14
    FIT: 12
    STYLING: 10
    COLOR: 4
    CLOSING: 4
    PROOF: 8
