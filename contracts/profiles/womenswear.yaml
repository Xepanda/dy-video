# 严禁无依据杜撰的高危材质/成分宣称词（贴纸与 Hook 卡硬审计）
factual_claim_tokens:
  - "100%"
  - "纯羊绒"
  - "纯羊毛"
  - "山羊绒"
  - "桑蚕丝"
  - "真丝"
  - "白鸭绒"
  - "鹅绒"
  - "90绒"
