# 女装直播带货垂直品类档案 v1.0（ADR-002 D5 / V33-01）
# 数据驱动管理女装词表、搭配正则、换款特征、躯干 ROI 策略与叙事角色权重。
# 未来扩展美妆/食品/3C 等品类时，仅需在 contracts/profiles/ 下新增对应 YAML。

profile_id: womenswear
display_name: 女装直播带货
version: "1.0"

# 换款 / 离场硬排除词（命中即判定 OTHER_SKU）
changeover_patterns:
  - "换下一款"
  - "看下一件"
  - "下一套"
  - "下一号"
  - "换掉"
  - "拿走"
  - "去换衣服"
  - "下一款衣服"
  - "换件衣服"
  - "过款"
  - "换款式"
  - "走开一下"
  - "我们换"
  - "下一件"
  - "换下一个"
  - "不能再讲这个了"
  - "我们要开始上对头了"
  - "下楼"

# 合法搭配语境正则（用于区分“上衣搭西裤”与“主推西裤”）
styling_context_patterns:
  - '搭(配)?.*?(裤|裙|鞋|包|开衫|马甲|西裤|打底)'
  - '配.*?(裤|裙|鞋|包|开衫|马甲|西裤|打底)'
  - '脚上(穿|搭)'
  - '下半身.*?(搭|配)'
  - '里面(搭|穿)'

# 主推他款正则（即使含搭配词，若在推销下装/换款也视为 OTHER_SKU）
promotes_other_item_pattern: '(主推|拍|买|这款|这条|这件裤|给大家|安排|换下).*(裤|裙)'

# 直播叫卖 / 迫切催单 / 库存离场硬过滤正则
inventory_changeover_regexes:
  - '.*库存.*'
  - '.*只剩.*'
  - '.*单了.*'
  - '.*快下了.*'
  - '.*上链接.*'
  - '.*一号链接.*'
  - '.*抢购.*'
  - '.*秒杀.*'
  - '.*现货.*'
  - '.*发货.*'
  - '.*不能再讲.*'
  - '.*上对头.*'
  - '.*换下一款.*'
  - '.*下楼.*'
  - '.*过款.*'
  - '.*拿走.*'
  - '.*去换衣服.*'
  - '.*换款式.*'
  - '.*不用讲.*'
  - '.*随便对比.*'
  - '.*凑单去拍.*'
  - '.*抠衣.*'
  - '.*扣[1一小].*'
  - '.*加[鲜现]货.*'
  - '.*一号[令练界链].*'
  - '.*手批.*'
  - '.*抢[毛大]衣.*'
  - '.*先去抢.*'
  - '.*不等了.*'
  - '.*要.*的大宝.*'

# 叙事漏斗角色识别词库
narrative_role_keywords:
  HOOK: ["你看", "姐妹们", "闭眼入", "第一件", "今天这件", "必须抢", "惊艳", "太显瘦"]
  FABRIC: ["面料", "手感", "羊毛", "羊绒", "真丝", "蚕丝", "棉", "材质", "羽绒", "软糯", "亲肤", "纱线", "织法", "克重"]
  FIT: ["版型", "显瘦", "不挑人", "遮肉", "挺括", "落肩", "正肩", "垂坠", "修身", "藏肉", "肩线", "领口"]
  STYLING: ["搭配", "穿法", "配裤子", "配裙子", "下半身", "叠穿", "内搭", "外穿", "一衣多穿", "通勤"]
  COLOR: ["颜色", "色系", "黑色", "白色", "米色", "咖色", "燕麦色", "灰色", "藏青", "显白"]
  CLOSING: ["小黄车", "拍一发", "库存", "带回家", "下单", "手慢无", "放心拍"]

# 经核实后允许自动生成贴纸的常见材质/版型/穿搭词（防造假仍须在档案或台词中出现）
verified_lexicon:
