    - "防泼水"
    - "羊毛"
    - "混纺"
    - "针织"
  fit:
    - "显瘦"
    - "修身"
    - "垂坠"
    - "正肩"
    - "落肩"
    - "宽松"
    - "直筒"
    - "包容"
    - "遮肉"
