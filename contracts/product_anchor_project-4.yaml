# ============================================================================
# project-4 商品锚点契约（v2 正式版 · 唯一真值源）
# ----------------------------------------------------------------------------
# 来源：docs/project-4_clip_selection_spec_v2.md §2.4
# 性质：声明式规则定义，非代码实现。本文件为可直接采用的规范产出物。
# 接线点（待工程接入，接入前不参与流水线运行）：
#   S1   -> asr_homophones 归一 + 句级三分类，必须在选段打分之前执行
#   S1.5 -> positive/negative_terms + selling_points + gates 生成 eligible_windows
#   S2   -> 只从白名单取块，plan 携带 clip_schema 全字段
#   S5   -> gates.block_level_assertions 升为 BLOCK
#   S6   -> 按 selling_points 复算覆盖率、按 negative_terms 复算零命中
# 约束：不得把他品话术改写成本品话术；纠错仅限同音错字/字形，时间戳守恒。
# ============================================================================

product:
  id: project-4
  name: "法式高级感羊毛混纺针织上衣"
  anchor_image: "C:/Users/ePanda/Desktop/project-4/封面图.png"
  allowed_category: ["针织上衣", "毛衣", "上装"]
  forbidden_category: ["裤装", "棉服", "大衣", "外套", "鞋包"]
  visual_traits:
    color: "米灰/燕麦色/暖灰，高明度低饱和"
    neckline: "宽圆领"
    sleeve: "蝙蝠袖/落肩"
    silhouette: "横向宽展宽松廓形"
    detail: "下摆罗纹、细密针织纹理"
    shot: "白底平铺挂拍"
  positive_terms: [毛衣, 针织, 上衣, 绵羊毛, 羊毛, 羊绒, 混纺, 浑坊, 浑仿,
                   燕麦色, 颜麦色, 大香灰, 纱线, 杀线, 刹线, 一线成型,
                   领形, 领型, 肩线, 蝙蝠袖, 罗纹, 版型, 板型, 显瘦,
                   起球, 气球, 现货, 先货, 在仓, 尺码表]
  negative_terms: [裤, 库长, 裤长, 毛呢裤, 毛泥裤, 膝盖, 裤腿, 西裤, 卫裤,
                   皮裤, 内里, 棉服, 棉浮, 填充物, 舔充物, 退货率,
                   "加100条", "加一百条", "83848586"]
  asr_homophones:            # 只改同音错字/字形，禁止跨品类改写
    浑坊: 混纺
    浑仿: 混纺
    颜麦色: 燕麦色
    刹线: 纱线
    杀线: 纱线
    气球: 起球
    板型: 版型
    先货: 现货
    在藏: 在仓
    毛泥裤: 毛呢裤          # 仅纠错，不改变品类
    库长: 裤长              # 仅纠错，不改变品类
    棉浮: 棉服              # 仅纠错，不改变品类
    舔充物: 填充物
    "Smart穿到": "S码穿到"
    "1号练接": "1号链接"
    "灵界鸡": "1号链接"
    "牌现货": "拍现货"
    全民扣衣: "扣1"
    扣小衣: "扣1"

selling_points:              # 7 类必备卖点
  composition:  {level: P0, terms: [绵羊毛, 羊毛, 羊绒, 混纺, 浑坊, 针织, 面料]}
  color:        {level: P0, terms: [燕麦色, 颜麦色, 大香灰, 灰调, 燕麦, 颜色]}
  size:         {level: P0, terms: [尺码表, "S码", "M码", "L码", "80-10", "100-11", "115-1", 斤]}
  cta:          {level: P0, terms: [现货, 先货, 上车, 秒杀, 加单, 库存, 在仓, 链接, 拍]}
  craft:        {level: P1, terms: [纱线, 杀线, 一线, 领形, 领型, 肩线, 罗纹, 蝙蝠袖]}
  fit:          {level: P1, terms: [版型, 板型, 显瘦, 宽松, 上身, 廓形, 通勤]}
  quality:      {level: P1, terms: [起球, 气球, 柔软, 亲肤, 垂感, 细腻, 顺滑]}

gates:
  block_level_assertions: [C5_分镜级商品主体一致性, C6_必备卖点覆盖率,
                           他品词零命中, 白名单ID校验, Hook主体明确]
  clip_hero_score_min: 0.75          # CLIP 接线后用 golden set 重新标定
  histogram_fallback_min: 0.15       # 零依赖降级口径，仅 WARN
  other_gap_expand_sec: 5            # 命中他品的 block 前后各扩展剔除
  max_single_source_ratio: 0.40
  min_source_count: 3
  clip_duration_sec: [3, 12]
  sentence_offset_sec: 0.45          # 沿用 slicing_rules R1

clip_schema:                         # 每个分镜 MUST 携带
  - id
  - source_block_id                  # 必须能回溯到 eligible_windows 白名单
  - product_tag                      # 本品 / 他品 / 中性
  - text_hero
  - text_other
  - visual_hero
  - visual_other
  - ocr_hero
  - ocr_other
  - selling_point                    # 命中的必备卖点类目
  - reason                           # 为什么选它
