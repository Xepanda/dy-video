# ============================================================
# 抖音电商违规词库（极限词清单）v1.0
# ------------------------------------------------------------
# 来源：飞书《违规整合》（抖音电商学习中心）
#   https://chenyihao.feishu.cn/wiki/HG5QwYqBQthekvZpNcuk1An4B
# 整理日期：2026-10-27
#
# 匹配规则：
#   words   —— 精确子串匹配（长词，低误报）；命中即违规。
#   patterns—— 正则族匹配（短词根，如"最X"），配合 allow 白名单
#               （常见非违规用法，如"最近/最后/最大码"）。
#   severity—— BLOCK（默认）：命中必须三通道处理；
#               WARN：仅记录不处理（预留）。
#
# 维护：词条只增删本文件，不改代码；更新后版本号 +1。
# ============================================================

version: 1
source: "飞书《违规整合》（抖音电商学习中心）"
source_url: "https://chenyihao.feishu.cn/wiki/HG5QwYqFBiQthekvZpNcuk1An4B"
updated: "2026-10-27"

# 全库共用白名单：这些用法出现在任何词族里都不算违规
global_allow:
  - "最大码|最小码|最大号|最小号|最大尺码|最小尺码|加大码|加大号"   # 尺码用语
  - "最近|最后|最初|最终|最迟|最晚|最怕|最爱|最下面|最上面|最里面|最外面"  # 非宣传性"最"
  - "第一时间|第一眼|第一次|第一天|第一回|第一件|第一款|第一句话|第一章|第一节|第一阶段|第一步|第一反应"  # 非排名性"第一"
  - "一线城市|一线性"                    # 地理/非宣传性"一流"近似词单列

categories:

  # ---------------------------------------------------------- 1. 包含"最"及相关词语
  - id: extreme_zui
    name: 绝对化用语-最系列
    severity: BLOCK
    patterns:
      - '最(佳|具|赚|优|秀|好|大|高|级|档|奢侈|低|便宜|流行|受欢迎|时尚|聚拢|符合|舒适|先|先进|新|科技|科学|技术|加工工艺|程度|低价|低价位|出色|完美|厉害|牛)'
    words: []
    allow:
      - "最大码|最小码|最大号|最小号|最大尺码|最小尺码"
      - "最近|最后|最初|最终|最迟|最晚|最怕|最爱|最下面|最上面|最里面|最外面"
      - "最起码|最多|最少|最高温度|最低温度"   # 口语非宣传用法（可按需删减）

  # ---------------------------------------------------------- 2. 包含"一"及相关词语
  - id: extreme_yi
    name: 绝对化用语-一系列
    severity: BLOCK
    patterns:
      - '第[一1](名|品牌|大|一款|一版|一季|一弹|一炮)'
      - '(全国|世界|中国|全网|全行业|全球)?第[一1](?![眼时间次天回章节节段步件顿句反应])'
    words:
      - "中国第一"
      - "全网第一"
      - "销量第一"
      - "排名第一"
      - "第一品牌"
      - "行业第一"
      - "NO.1"
      - "TOP.1"
      - "Top1"
      - "top1"
      - "仅此一家"
      - "仅此一次"
      - "仅此一款"
      - "唯一"
      - "独一无二"
      - "一流"
      - "全国销量冠军"
    allow:
      - "第一时间|第一眼|第一次|第一天|第一回|第一件|第一款|第一句话|第一章|第一节|第一阶段|第一步|第一反应|第一套|第一组"
      - "一线城市"

  # ---------------------------------------------------------- 3. 滥用权威性和资质类表述
  - id: authority_abuse
    name: 权威性与资质滥用
    severity: BLOCK
    patterns:
      - '(世界|全国|全球|行业|全网)?领先'
      - '[\u4e00-\u9fa5]{0,4}之王'
      - '(销量|销售)?冠[军王]'
    words:
      - "领先上市"
      - "领袖品牌"
      - "创领品牌"
      - "领导品牌"
      - "领导者"
      - "缔造者"
      - "王者"
      - "问鼎"
      - "至尊"
      - "巅峰"
      - "性价比之王"
      - "顶级工艺"
      - "王牌"
      - "销量冠军"
      - "国家领导人推荐"
      - "国家机关推荐"
      - "国家机关专供"
      - "特供"
      - "国宴专用"
      - "政协用酒"
      - "人民大会堂"
      - "全国人大"
      - "政府定价"
      - "驰名商标"
      - "质量免检"
      - "无需国家质量检测"
      - "国家免检"
      - "免抽检"
      - "军队"
      - "解放军"
      - "武警"

  # ---------------------------------------------------------- 4. 虚假或无法判断真伪的夸张表述
  - id: false_absolutism
    name: 虚假夸张用语
    severity: BLOCK
    words:
      - "绝无仅有"
      - "前无古人"
      - "史无前例"
      - "万能"
      - "绝对"
      - "永久"
      - "无敌"
      - "史上最"
      - "史上第一"

  # ---------------------------------------------------------- 5. 包含"首/家/国"及相关词语
  - id: shou_jia_guo
    name: 首/家/国系列
    severity: BLOCK
    patterns:
      - '(全球|全国|全网|宇宙|全宇宙|史上)?首发'
      - '国家[级式样]'
      - '填补国内空白'
    words:
      - "首个"
      - "首选"
      - "全球首发"
      - "全国首家"
      - "全网首发"
      - "首款"
      - "首家"
      - "独家"
      - "独家配方"
      - "全国销量冠军"
      - "国家级产品"
      - "国家领导人"

  # ---------------------------------------------------------- 6. 包含"级/极"及相关词语
  - id: ji_ji
    name: 级/极系列
    severity: BLOCK
    words:
      - "国家级"
      - "全球级"
      - "宇宙级"
      - "世界级"
      - "极品"
      - "极佳"
      - "绝佳"
      - "极致"
      - "顶级"
      - "顶尖"
      - "尖端"
      - "顶级工艺"
      - "顶级享受"
      - "终极"

  # ---------------------------------------------------------- 7. 强营销属性话术（高频违规2/3/4/5）
  - id: marketing_abuse
    name: 强营销属性话术
    severity: BLOCK
    patterns:
      - '(给我|给个|点个|求个)?关注'
      - '加入(粉丝团|粉丝群|群聊)'
      - '点亮[灯灯牌牌徽]'
      - '扣[1一2两3三]'          # 诱导互动扣数字
      - '刷[起个]来'
    words:
      - "关注主播"
      - "粉丝群"
      - "粉丝团"
      - "灯牌"
      - "秒杀"
      - "福利价"
      - "亏本"
      - "跳楼价"
      - "清仓"
      - "卖惨"

  # ---------------------------------------------------------- 8. 医疗/绝对化功效（服饰类高风险）
  - id: medical_claim
    name: 医疗功效宣称
    severity: BLOCK
    words:
      - "治疗"
      - "治愈"
      - "根治"
      - "消炎"
      - "药效"
      - "医用"
      - "疗效"
      - "防癌"
      - "抗癌"
      - "杀菌率"
      - "除螨率"
      - "助眠"
      - "失眠"
      - "减肥"
      - "燃脂"
