# dy-live-editor 量化约束契约 v1.0
# 依据《会议纪要》+ 2026-10-20 客户决策编制；每个 metric key 在 constraints_map.md 登记纪要原文。
# 规则：阈值只改本文件，不改代码；本文件版本进入缓存键与 QC 报告。

version: 1.7
updated: "2026-10-28"

# ============ 变更记录 ============
# v1.4 (2026-10-27) 工作流重构（反馈驱动）：
#   - 封面全幅底图：normalize_subject_framing 黑画布放置改为
#     max(构图scale, 填充scale) 全幅覆盖，顶部黑边根因消除；
#     封面渲染新增顶部/底部渐变遮罩（scrim）保证文字可读性。
#   - 新增 transition_effect 段：切片间视频 xfade + 音频 acrossfade 转场。
#   - 新增 magnifier_effect 段：放大镜圆圈细节展示特效。
#   - 新增 violation_words 段：抖音极限词库接入 + 三通道处理配置
#     （字幕屏蔽 / 语音消音 / 视频打码）。
#   - 新增 overlay_face_safety 段：叠加层（贴纸/Hook卡/字幕/特效）不得
#     遮挡模特面部的量化审核。
#   - 新增 consistency_check 段：素材-契约一致性预检（ASR 关键词覆盖
#     vs 规范关键词），防止挂羊头卖狗肉式素材错配。
#   - 新增 fade_effect 段：全片头尾淡入淡出。
# v1.1 (2026-10-21) 泛化验收修正：
#   - 双肩深度差由硬门禁(0.055)改为软罚分 + 极端侧身硬上限(0.45)。
#     依据：6 号素材实测主播重心切换/侧身展示时 dz 中位数 0.26，原硬门禁误杀全部候选；
#     纪要"主播表情正常"的量化门禁是 face_yaw/EAR/MAR，双肩 dz 并非纪要约束。
#   - 遮挡判定由"腕过肩+0.08"改为"腕高过鼻梁"（抬手展示姿态不再误判）。
#   - 踝部可见性阈值 0.40 → 几何判据（ankle_y_max 0.99，鞋底贴下边缘的全身构图不再被误杀），
#     新增膝盖扫描门禁（与 QC C5 BLOCK 一致）。
#     依据：6 号素材实测踝部 vis 中位数 0.40 但鞋完整可见（模型置信度≠遮挡度量）。
#   - 新增 ocr 段（B11 背景文字纯净度）。
# v1.2 (2026-10-21) 泛化验收修正二：
#   - 全帧清晰度扫描门禁由绝对 200 改为"绝对地板 80 + 素材分位相对校准
#     （中位数×0.8）"。依据：各素材相机素质差异大（实测中位数 demo 244 /
#     9号 182 / 8号 144 / 7号 96），绝对阈值误杀 7 号素材 97% 帧；
#     防糊硬门禁仍是归一化放大后的 post_scale_sharpness ≥200（BLOCK）。
#   - 漏斗配额默认降为 WARN（funnel_enforce_level），类目稀薄素材不再一票否决。
# v1.3 (2026-10-25) 全局统一 + 死键接线：
#   - video.fps 30 → 60（帧率全局统一 60fps，覆盖原决策 4 的 30fps）。
#   - 新增 hook_card 段（width/height/y_min/y_max/face_top_gap_px）：
#     Hook 标题卡全局统一 720×168（原 SKILL.md 的 940~980 口径作废——
#     1080 画幅上宽到接近满幅只剩左右各 50px 边距，且与顶部标识条争空间）。
#   - 新增 zoom_effect.zoom（面料块目标倍率 1.3），并让 zoom_effect.max_zoom
#     成为渲染端钳制上限与 QC 断言阈值（此前是死键，改 yaml 无效）。
#   - mirror_effect.min_occlusion_ratio 语义明确为"遮挡覆盖率下限"
#     （上半屏可遮挡文字面积 / 全部有效文字面积），低于阈值放弃该分镜镜像。

# ============ 黄金 3 秒 Hook 标题卡（2026-10-25 全局统一 720）============
# 原 SKILL.md §1.2 写"940~980px 超大标题卡"，实际实现为 720×168 折中卡。
# 2026-10-25 决策：**全局统一 720 宽**（不再保留 940~980 口径），
# 理由——1080 画幅上 940~980 只剩左右各 50px 边距，且与顶部平台标识条争空间。
hook_card:
  width: 720                      # 标题卡宽（px），全局统一值
  height: 168                     # 标题卡高（px），落在 SKILL 的 160~180 区间
  y_min: 150                      # 纵向定位下限（px）
  y_max: 430                      # 纵向定位上限（px）
  face_top_gap_px: 30             # 卡底与人脸顶的最小安全间距（px）

# ============ 封面底图约束（C1~C7, V7）============
cover:
  sharpness_min: 200              # C1 归一化放大后清晰度门禁（post_scale_sharpness，BLOCK）
  sharp_admission_min: 80         # C1 扫描期全帧清晰度绝对地板（排除运动模糊垃圾帧）
  sharp_relative_ratio: 0.8       # C1 扫描期相对校准：准入线 = max(地板, 素材全帧清晰度中位数×0.8)
  face_sharpness_min: 150         # C1 人脸区域清晰度（防放大糊脸）
  # ⚠️ 以下 3 个键**当前无任何代码消费**（2026-10-24 审计确认），保留仅为登记需求。
  #    改它们不会改变任何行为——若要实现，请同步更新 contracts_map.md 的状态列。
  ghosting_energy_max: 0.15       # ❌ 未实现：C2 帧间差分能量比（重影/运动模糊）
  contour_completeness_min: 0.95  # ❌ 未实现：C3 人像掩码完整度
  landmark_visibility_min: 0.40  # ❌ 未实现：关键点置信度下限（MediaPipe 自带置信度，未额外设阈）
  # C4 人脸朝向与表情（纪要"主播表情正常"的量化门禁，主判据）
  face_yaw_max_deg: 12            # C4 偏航角（solvePnP）
  ear_min: 0.18                   # C4 睁眼（EAR）
  mar_max: 0.35                   # C4 闭嘴（MAR）
  face_area_ratio_min: 0.003      # C4 人脸面积占比下限（防过远；直播全身帧实测 ~0.004）
  face_area_ratio_max: 0.25       # C4 人脸面积占比上限（防过近畸变）
  # 身体正面度（双肩深度差，非纪要约束；软罚分 + 极端侧身硬上限，v1.1）
  shoulder_dz_soft: 0.055         # 超过则候选评分罚分（身体正面度 s_frontal）
  shoulder_dz_max: 0.45           # 极端侧身硬排除（3/4 侧身以内仍可参选，由 face_yaw 主把关）
  # C5 完整人体
  knees_visible: true
  ankles_visible: true
  knee_y_max: 0.92                # C5 膝盖归一化纵坐标上限
  ankle_y_max: 0.99               # C5 脚踝纵坐标上限（v1.1 几何判据：踝在画面内；直播全身构图鞋底常贴下边缘）
  knee_visibility_min: 0.30       # C5 膝盖可见性下限（模型置信度卫生检查）
  # ankle_visibility_min 已废弃（v1.1）：踝部"可见性"是模型置信度而非遮挡度量，
  # 画面底部边缘 landmark 置信度天然偏低（实测 vis 中位 0.40 但鞋完整可见），
  # C5 踝部改几何判据 ankle_y_max。
  # —— 决策 1：水平 1:6:1（左:人:右），人宽占画布 75% 居中 ——
  horizontal_margin_ratio: [1, 6, 1]   # ⚠️ 未接线：1:6:1 语义已由 person_width_ratio 承载
  person_width_ratio: 0.75        # C6 810/1080（目标值）✅ 已接线到 normalize_subject_framing
  person_width_tolerance: 0.03    # C6 width_ratio 允许 [0.72, 0.78] → PASS
  person_width_warn_range: [0.36, 0.85]  # 示例版式下的 WARN 区间（名称区预留后人宽实测 ~0.38-0.55）
  # 构图策略（决策冲突的可切换开关，几何取舍说明见 docs/improvement_plan 第 11 节）：
  #   example        —— 示例版式优先：脚底 78% + 名称区独立（默认，实测宽占比 0.38~0.56）
  #   width_priority —— 决策 1 优先：人宽锁定 75%，身高上限 88%（腿部进入名称区，名称覆盖在人像上）
  framing_policy: example
  person_height_max_ratio: 0.80       # 人体高上限 ✅ 已接线（为底部商品名区预留空间）
  feet_target_ratio: 0.78             # 脚底目标位置 ✅ 已接线（名称区顶部上方）
  head_floor_ratio: 0.155             # 头顶预留 ✅ 已接线（避让品牌区）
  head_top_min_ratio: 0.13        # C6 头顶预留 ✅ 已接线（避让品牌区）
  # C7 衣着一致性（CLIP 阈值；直方图降级阈值见 garment_match.histogram_min）
  garment_match_min: 0.75
  # V7 封面纯净度
  ocr_area_ratio_max: 0.02            # ⚠️ 未接线：实际生效的是 ocr.background_text_area_max
  # 候选扫描参数
  scan_step_sec: 1.5
  scan_limit_sec: 180
  top_k: 5

# ============ 衣着一致性检测参数 ============
garment_match:
  engine: auto                    # auto | clip | histogram
  histogram_min: 0.15             # 直方图降级阈值（有限样本标定：同款~0.25/异色~0.0；WARN 级）✅ 已接线
  garment_match_min: 0.75         # CLIP 精确阈值（BLOCK 级；待 5 商品×20 帧标定）✅ 已接线
  clip_model: ViT-B-32            # ⚠️ 未接线：open_clip 模型名当前硬编码，暂不支持配置

# ============ 封面背景文字纯净度（V7, B11）============
ocr:
  engine: rapidocr                  # rapidocr（PP-OCR ONNX 版）| paddleocr（预留，需 paddlepaddle）
  background_text_area_max: 0.02    # V7 背景文字面积占比上限（BLOCK）
  min_confidence: 0.5               # OCR 框最低置信度
  min_box_area_px: 400              # 忽略小于该面积的噪点框（px²）
  enforce_level: BLOCK              # BLOCK（默认）| WARN（店招密集直播间可降级）

# ============ 文本排版约束（C8~C10, C15~C16；版式复刻会议纪要示例图）============
text:
  wrap_width_ratio: 0.92          # C9/C16 单行超过 92% 画布宽触发换行
  line_spacing_ratio: 1.22
  font_size_base: 96              # C10 商品名基础字号（示例图实测 ~100pt 等效）
  font_size_min: 64               # C10 商品名字号下限
  product_name_top_ratio: 0.80    # 名称区顶部（画幅比例，示例图 y≈80%）
  product_name_stroke_width: 5    # 商品名深褐描边宽度
  brand_font_size_en: 74          # C15 品牌英文主标字号
  brand_font_size_cn: 52          # C15 品牌中文副标字号
  brand_en_gradient: ["#C9A66B", "#8A652F"]   # 品牌青铜渐变（示例图采样校准）
  # —— 决策 2：商品名标准色 = 金色 ——
  product_name_gradient: ["#FFE9A8", "#E8A91E"]
  product_name_stroke: "#3D1F0E"
  product_name_shear: -0.12       # C10 动感斜体
  product_name_hue_range: [35, 55]   # QC 色相断言（度）
  product_name_sat_min: 0.5          # QC 饱和度断言
  product_name_hue_pixel_ratio: 0.60 # QC 金色像素占比下限
  brand_en_fill: "#FFEBAA"
  brand_en_stroke: "#381E11"
  brand_cn_fill: "#FFFFFF"
  brand_cn_stroke: "#381E11"

# ============ 封面贴图约束（C11~C14）============
sticker:
  size: 280                       # C11 正方形边长
  # 2026-10-28 自然过渡贴图（反馈：右侧商品图不得生硬）
  use_adapter_edges: true         # 启用羽化/渐变融合/去晕边缘处理
  sticker_feather_px: 10          # 贴图外边缘淡化宽度（反馈收敛：只要边缘柔和一些）
  sticker_dehalo: true            # 贴图去晕（深色商品图边缘的脏边清除）
  # 2026-10-28 贴图样式（反馈演进：白底是商品图自身背景，不能抠掉）：
  #   card    —— 保留商品图原样背景，仅圆角 + 外边缘柔和淡化 + 投影（当前默认）；
  #   cutout  —— 去白底（剪影描边+剪影投影的贴纸形态，商品图无自身背景时用）。
  sticker_style: card
  cutout:
    white_thresh: 205             # 近白判定：亮度阈值
    sat_thresh: 42                # 近白判定：饱和度上限（max-min）
    feather_sigma: 1.8            #  alpha 羽化高斯 sigma（280px 贴图约 4px 轻度过渡带；
                                 # 2026-10-28 反馈：淡化太夸张，只要边缘轻淡）
    erode_px: 1                   # 去底前 alpha 腐蚀（去商品边缘光晕）
    corner_radius: 0              # 圆角半径（0 = 沿用 sticker.radius）
    # 2026-10-28 反馈"商品贴图要贴上去"：去底商品需明确读作贴在封面的贴纸
    outline:                      # 剪影描边（die-cut 贴纸语言，消除"漂浮感"）
      enabled: true
      width: 3                    # 描边宽度 px
      color: "#FFFFFF"            # 描边色（浅色；深色商品用白描边最清晰）
    shadow:                       # 剪影投影（跟随商品轮廓，非矩形卡）
      enabled: true
      offset_y: 8                 # 投影下移 px
      blur: 7                     # 投影模糊半径 px
      alpha_scale: 0.42           # 投影浓度 0~1
      color: "#1A0D07"
  margin_a: 32                    # C12 靠左/靠右距离 a
  gap_a: 32                       # C13 两图间距 a
  side: right                     # C12 left | right
  # 2026-10-24 需求变更：原先并排（horizontal）→ 改为**靠右对齐、从上到下垂直堆叠**。
  # vertical 时两张贴图整体垂直居中（vertical_center），左内容区（人物）不受影响。
  layout: vertical                # vertical（上下堆叠，靠右对齐）| horizontal（两张并排）
  # 2026-10-28 归位：以下四键历史被错放在 split_effect 段（死键，贴图实际读代码
  # DEFAULTS），现迁回本段生效。
  radius: 20                      # C14 贴图圆角半径
  border_color: "#E2E8F0"         # C14 贴图描边色
  border_width: 0                 # 2026-10-28 反馈：浅色描边即"白边"，默认关闭（0=无描边）
  vertical_center: 960            # C13 两图组合块中心 y

# ============ 视频顶部平台标识条（2026-10-24 新增）============
# 视频画面最上方的平台/店铺账号标识区（抖音生态的"账号角标"位置）。
# 常驻显示，不参与分镜切分；用于建立账号识别与合规露出。
platform_bar:
  enabled: true
  height: 88                      # 条高（px）
  top: 0                           # 距顶 0
  background: "#101014"           # 底色
  background_alpha: 150           # 底色不透明度（0~255）
  shop_name: ""                   # 店铺名；空则取 brand.title_en
  account: ""                     # 账号名（带 @）；空则取 brand.subtitle_cn
  font_size: 34
  text_color: "#FFFFFF"
  accent_color: "#E2C98A"         # 左侧竖条/图标强调色
  padding_x: 28
  show_icon: true                 # 左侧圆形店铺图标
  icon_size: 44

# ============ 视频挂角贴纸特效（阶段式利益点，2026-10-24 新增）============
# 每个分镜在指定位置挂一枚利益点徽标，按"出现→停留→消失"的时序播放。
video_sticker:
  enabled: true
  size: 220                       # 正方形边长
  margin_x: 40                    # 距左右边缘
  margin_y: 300                   # 距顶（避开顶部标识条与 Hook 卡）
  side: right                     # left | right
  fade_in_sec: 0.35               # 出现（淡入）时长
  fade_out_sec: 0.35              # 消失（淡出）时长
  hold_ratio: 0.72                # 停留时长占分镜时长的比例
  delay_ratio: 0.10               # 分镜内延迟启动比例（避免与切点撞车）
  font_size: 40
  text_color: "#3D1F0E"
  bg_color: "#FFE9A8"             # 金色底（与封面商品名呼应）
  border_color: "#E8A91E"

# ============ 放大特效（推镜）============
# 分镜内的动态推镜：到达触发点后按缓动曲线推到目标倍率。
# 2026-10-24 起由静态裁切（zoom 一次性生效）升级为**定时缓动推镜**。
zoom_effect:
  trigger_sec: 0.8                # 分镜内触发点（秒，从分镜起点算）
  transition_sec: 1.2             # 过渡时长（秒）
  easing: smoothstep              # smoothstep | linear
  zoom: 1.3                       # 面料块的目标倍率（SKILL 规定 1.25~1.35 区间内）
  max_zoom: 1.35                  # 目标倍率上限（1.25~1.35 符合 SKILL 规格）——渲染与 QC 的硬上限
  y_anchor: 0.35                  # 锚点（0.35h~0.65h）
  enabled: true

# ============ 镜像/分屏特效（2026-10-24 接线）============
mirror_effect:
  enabled: true
  # 镜像后背景招牌文字会反向，必须用贴纸精确遮挡（SKILL 2.1）
  occlusion_required: true        # 找不到可遮挡文字时，是否拒绝启用镜像
  min_occlusion_ratio: 0.25       # 遮挡覆盖率下限（低于则放弃该分镜的镜像）
                             # 含义：镜像分镜"上半屏可遮挡文字面积 / 全部有效文字面积"，
                             # 覆盖率过低说明反向文字大多落在贴纸遮不到的范围内
                             # （如下半身服饰印花、字幕带），贴纸遮不全 →
                             # 保留镜像必然露出反向文字，故放弃镜像（翻转回原方向）
  patch_color: "#1A1A1E"
  patch_alpha: 235
  patch_radius: 14

split_effect:
  enabled: true
  divider_width: 8                # 中缝金色发光分割线宽度（6~10px）
  divider_color: "#E8A91E"
  label_font_size: 30
  label_text_color: "#3D1F0E"
  label_bg_color: "#FFE9A8"
  label_padding: 14
  label_gap: 24                   # 标签距分割线的水平距离

# ============ 视频成片约束（V1~V6, V8）============
video:
  duration_range: [45, 65]        # V1
  resolution: [1080, 1920]        # V2
  fps: 60                         # 全局统一 60fps（2026-10-25 决策，覆盖原决策 4 的 30fps）
  subtitle_margin_v_min: 220      # V5 小黄车避让
  subtitle_safe_zone_px: 220      # ⚠️ 未接线：字幕安全区实际由 subtitle_margin_v_min 控制
  av_sync_error_max_ms: 40        # ⚠️ 未接线：PTS 归零已保证物理同步，但无独立量化断言
  black_frame_max_ratio: 0.0      # V6 黑帧占比 ✅ 已接线
  blackdetect_min_duration: 0.1   # V6 blackdetect 最短黑帧时长(s)
  # 分镜漏斗配额（build_plan 选段约束；节奏指导，默认 WARN 不拦截——
  # 纪要仅硬性要求总时长 45-65s；类目稀薄素材不应被一票否决。
  # funnel_enforce_level 可升为 BLOCK（需附回归结果，阈值变更纪律）
  funnel_enforce_level: WARN
  funnel:
    # hook 上限 8 → 12（2026-11-02，R10 节奏曲线）：原 3~8s 只能容下 **1 个**短段，
    # 导致钩子区只有 1 个切点、开场 6.4s 不够抓人（实测 R10 FAIL）。
    # 参考片钩子区（0~10s）有 **3 个切点**，段长 1.78/4.72/6.73s。
    hook:              { min: 3,  max: 12 }
    fabric:            { min: 8,  max: 20 }
    craft_detail:      { min: 8,  max: 20 }
    fit:               { min: 8,  max: 15 }
    styling:           { min: 15, max: 30 }
    decision_closing:  { min: 6,  max: 12 }

# ============ 切片规则（2026-11-01 新增）============
# 来源：参考成品 SSY410163_蝴蝶结高腰A字半身裙_切片.mp4 的实测拆解
#       （证据见 docs/reference_cut_analysis_SSY410163.md）
# 定位：把"人工切片为什么这么切"翻译成**可判定**的阈值，供 build_plan 选段、
#       切片时长控制、镜头多样性约束与 QC 断言消费。
# 纪律：每个键必须有消费点（§11.4 #20）；未接线的一律 state: disabled 并登记原因。
slicing_rules:
  enabled: true
  # ---- R1 切点落在 ASR 句末（语义边界），气口仅作辅助精调 ----
  # 参考片实测：9 个切点与最近 ASR 句末偏移中位 **0.03s**、最大 0.37s。
  # → 真正可复现的规则是"切在句末"（本仓库已有 _snap_end_to_sentence 承载），
  #   气口只用于在**多个候选句末之间**做精调，不改变"切在句末"这一大原则。
  #
  # ⚠️ 实测修正（2026-11-01）：参考成片切点处的 −120dB 是**拼接产物**
  #    （剪辑软件切音轨留下的缝），**不是**选段信号——
  #    源侧凹陷在切点处中位 8.2dB，与随机点 9.4dB 无富集（0/9 命中随机 95 分位）。
  #    且直播素材底噪高（实测 −53.4dB），绝对静音阈值在原始素材上命中 0 处。
  #    故气口判据必须用**相对凹陷**（相对局部语流电平的下陷深度），
  #    阈值随素材自适应（见 slicing_rules.adaptive_silence_db）。
  cut_on_speech_pause:
    enabled: true
    # 主判据：切点必须落在 ASR 句末（本仓库既有能力），此处定义其**允许偏移**。
    # 参考片实测偏移中位 0.03s / 最大 0.37s → 容差 0.45s 既覆盖真实分布，
    # 又远小于旧值 2.0s（2.0s 会把切点挪到别的句子上）。
    max_offset_from_sentence: 0.45
    # 句末吸附的搜索窗口（宁短勿长：只向前找，不越过后一句）
    snap_tolerance_sec: 0.45
    # 辅助精调：气口（相对凹陷）的最小深度 dB。低于此值的凹陷不算气口。
    dip_threshold_db: 8.0
    # 气口搜索窗口（在句末附近 ±该窗口内找更深的凹陷）
    search_window_sec: 0.40
    # 自适应静音阈值：thr = max(absolute_db, 素材底噪 + floor_margin_db)
    absolute_db: -60.0
    floor_margin_db: 6.0
    # 找不到气口时回退：保留原句末标点切点
    fallback: keep_punctuation
    # 画面变化但语音连续的"句内视觉切点"允许存在（参考片 2/9 = 22%），
    # 但占比不得超过该上限，避免通篇跳切。
    intra_sentence_cut_max_ratio: 0.30
  # ---- R2 片段时长区间（参考片 11 段：5~10s 占 45%，中位 5.82s，区间 1.51~12.96s）----
  # ⚠️ 2026-11-03 修正：原先按"10 段"标定 min_sec=1.7（最短段误记为 1.78s）。
  #    复核发现参考片实为 **11 段**（漏检 49.24s 切点——帧差 5.1×中位，
  #    Δα=0.515 单帧跳变，是一个 1.51s 的"提神快切"）。
  #    真实最短段 1.51s → 下限须放宽到 1.5，否则会误判参考片自身的快切段。
  clip_duration:
    enabled: true
    min_sec: 1.5                # 参考片最短段 1.51s；低于此判"碎切"
    target_sec: 6.3             # 参考片中位
    max_sec: 13.0               # 参考片最长段 12.97s；超过判"拖沓"
    enforce_level: WARN         # WARN 不拦截（类目稀薄素材不应被一票否决）
  # ---- R3 镜头景别（参考片 9/10 全身，span 中位 0.640、区间 0.473~0.996）----
  # 判据用 **span**（头顶→踝 = 人物在画面中的完整可见高度），不用 body_h（肩→踝）——
  # 后者受站姿/抬腿影响大，实测同一片段波动 ±0.08，会造成误判。
  # 主体须完整入画，保证"上身效果"可判。
  shot_framing:
    enabled: true
    min_body_height_ratio: 0.45     # 全身景别门槛（span 归一化跨度）
    target_body_height_ratio: 0.60  # 参考片 span 中位 0.640；作为**下限**用（含 10% 容差）
    full_body_min_ratio: 0.70       # 全身景别在成片中所占比例下限（参考片 100%）
    enforce_level: WARN
  # ---- R4 展示角度多样性（参考片 10 段 10 种角度，相邻不重）----
  shot_variety:
    enabled: true
    min_distinct_angles: 3          # 成片至少 3 种不同展示角度
    max_same_angle_consecutive: 1   # 同角度最多连续 1 段（即不允许连续 2 段同角度）
    enforce_level: WARN
  # ---- R5 语音密度（参考片 96.4%，几乎无冷场）----
  speech_density:
    enabled: true
    min_ratio: 0.85             # 成片有声时长 / 总时长 下限
    enforce_level: WARN
  # ---- R6 卖点顺序可按品类覆写（参考片是 hook→fit→fabric→styling，与默认相反）----
  # 半身裙卖点重心是"比例显瘦"而非面料质感：面料只占 14%。
  # 顺序键沿用 build_plan 的漏斗类目；由 spec.options.funnel_order 覆写。
  funnel_order_overridable: true
  default_funnel_order: [hook, fabric, fit, styling]
  # ---- 品类漏斗预设字典（2026-11-03 T7）----
  funnel_orders:
    skirt_dress: [hook, fit, craft_detail, styling, decision_closing]
    coat_outerwear: [hook, fabric, fit, styling, decision_closing]
    default: [hook, fabric, fit, styling, decision_closing]

  # ---- R7 转场风格（2026-11-02 新增：参考成片实测 9/9 全硬切）----
  # 实测证据（SSY410163_切片.mp4）：
  #   · 9 个切点的 α(t) 演化均为**单帧跳变**（最大 Δα 0.41~0.90），
  #     逐帧差分在切点处仅 1 帧尖峰（跳变值为片内中位的 14.1 倍）；
  #   · 零个切点存在可被线性混合解释的中间帧 → **无任何叠化/转场**。
  #   · 音频侧同步为硬接：切点处为 -82~-120dB 数字静音（跨fade 会抹平此特征）。
  # 对照：本仓库默认 transition_effect = fade 0.25s（xfade+acrossfade），
  #   与参考片的剪辑语言相反 → 见 docs/reference_cut_style_analysis.md 改进方案。
  transition_style:
    enabled: true
    # hard_cut（参考片实测，纯硬切）| dissolve（叠化）| mixed（按 sell_point 决定）
    mode: hard_cut
    # dissolve 模式下的叠化时长区间（秒）。参考片为 0 → 用 0 表示硬切。
    dissolve_sec: 0.0
    dissolve_sec_max: 0.0
    # 音频侧是否随视频做交叉淡化（acrossfade）。
    # 参考片实测：硬切处是数字静音 → 不同步淡化（false）。
    audio_crossfade: false
    # 10ms 防爆音微淡化（D1 §1.5.3 / 改进 1 / C12）：消除硬切接缝处零交叉截断导致的 Click/Pop
    micro_afade_sec: 0.01
    # 硬切时是否在切点插入极短静音（"接缝静音"）。
    # 参考片实测切点处为数字静音，但那是**拼接产物**而非有意设计，
    # 故默认 false——不刻意制造静音，靠素材本身的自然气口。
    insert_silence_gap: false
    silence_gap_sec: 0.0
    enforce_level: WARN

  # ---- R8 音频风格（2026-11-02 新增：参考成片实测零 BGM、零音效、纯人声）----
  # 实测证据：
  #   · 频谱低频/中频比 -21.2dB（语音主导，BGM 会显著抬高该比值）；
  #   · 句间空隙中位电平 -36.8dB，接近底噪；动态范围 14.9dB；
  #   · 全片无 Boom/转场音效痕迹，无音乐床。
  #   · 响度 I=-15.3 LUFS / LRA=1.5 LU / TP=-1.5dBFS（已做标准化）。
  # 对照：本仓库默认混入 Sub-Bass Boom 重音 → 与参考片风格冲突。
  audio_style:
    enabled: true
    # 是否叠加背景音乐（参考片无 → false）
    bgm_enabled: false
    # 是否叠加 Boom/转场音效（参考片无 → false）
    boom_sfx_enabled: false
    # 目标综合响度（EBU R128）。参考片 -15.3 LUFS。
    target_lufs: -15.0
    lufs_tolerance: 1.5
    # 响度动态范围上限（LU）。参考片 1.5 LU——极窄，说明做过标准化压缩。
    max_lra: 4.0
    # 语音占比下限（有声时长/总时长）。参考片 96.4%。
    min_speech_ratio: 0.85
    # 切点是否允许音频断缝（参考片切点处有数字静音 → true）
    allow_cut_audio_gap: true
    enforce_level: WARN

  # ---- R9 调色一致性（2026-11-02 新增：参考成片段间变异系数 0.8%~7.8%）----
  # 实测证据（逐段取中位）：
  #   R/G 白平衡 1.6% / B/G 1.1% / 饱和 9.9% / 亮度 3.7% / 对比 9.8%
  #   → 参考片整片色调统一（做过统一调色或同机位同灯光）。
  #   段间跳变会让"商品颜色"失真（观众分不清卡其/奶白），属带货硬伤。
  color_consistency:
    enabled: true
    # 各指标的段间变异系数上限（%）
    max_cv_white_balance: 8.0     # R/G、B/G
    max_cv_saturation: 12.0
    max_cv_brightness: 8.0
    max_cv_contrast: 12.0
    # 采样：每段取 N 帧中位
    samples_per_clip: 3
    enforce_level: WARN

  # ---- R10 节奏与情绪曲线（2026-11-02 新增）----
  # 实测证据（参考片 69.34s / 10 段）：
  #   · 前 10s 切点最密（3 个）→ 钩子区快切抓人；
  #   · 句长中位数由前段 2.84s 收紧至后段 1.44s（中 1/3 段 1.42s）；
  #   · 语速 432 → 376 字/分（**变慢**），但句子变短 → 换气更密、更像真人对话；
  #   · 10~20s 区段切点数为 0（最长单段 12.97s）→ 中段留给"比例显瘦"的核心论证。
  # 即：节奏不是"越快越好"，而是**钩子快 → 中段慢 → 尾段再起**的三段式。
  pacing_curve:
    enabled: true
    # 开场钩子区（0~10s）的切点密度下限（个/10s）
    hook_cuts_per_10s_min: 2
    # 开场区切点密度上限——过密会显得慌乱
    hook_cuts_per_10s_max: 4
    # 句长中位数区间（秒）：过短=碎，过长=闷
    sentence_len_min: 1.2
    sentence_len_max: 3.0
    # 语速区间（字/分）
    speech_rate_min: 300
    speech_rate_max: 480
    # 首尾段的句长收紧比（后 1/3 中位 / 前 1/3 中位），<1 表示后段更碎更快
    tightening_ratio_max: 0.85
    # 中段（25%~70%）允许的最长单段（秒）——核心论证需要留白
    mid_section_max_clip: 13.0
    # 钩子区的选段参数（供 build_plan 制造多个短切点，而非一个长段）
    # 参考片钩子区段长 1.78/4.72/6.73s（0~10s 内 3 个切点）
    hook_segment_sec: 4.0        # 钩子区单段目标时长
    hook_target_sec: 10.0        # 钩子区累计目标时长（达到即停止继续切分）
    # 提神快切档（2026-11-03 T4：1.5~2.8s，最少 1 段，打破开场均质化）
    punch_min_sec: 1.5           # 提神快切单段时长下限（秒）
    punch_max_sec: 2.8           # 提神快切单段时长上限（秒）
    punch_min_count: 1           # 提神快切最少段数（个）
    # 时长离散度（σ / 极差比，2026-11-03，防平铺切片，参考片 σ=3.55s / 极差比 8.58）
    min_duration_sigma: 2.2      # 片段时长标准差下限（秒）
    min_duration_ratio: 4.0      # 最长段/最短段 时长比值下限
    enforce_level: WARN

# ============ 音频约束（V4）============
audio:
  loudness_lufs: -14              # V4 EBU R128 综合响度
  loudness_tolerance: 1.5
  true_peak_max_dbtp: -0.5        # V4 真峰值
  sample_rate: 48000

# ============ 价格约束（决策 3，V8）============
price:
  clip_exclude: true              # ⚠️ 未接线：选段级价格排除实际在 detect_price 内部实现
  subtitle_assert_zero: true      # 成片字幕零价格断言 ✅ 已接线
  detector: chinese_numeral_v1
  whitelist_units: ["码", "号", "厘米", "cm", "斤", "kg", "岁", "年", "月", "日", "点", "层", "度", "%"]  # ⚠️ 未接线

# ============ ASR 执行者审核门禁（需求 2/4）============
# ASR 识别结果必须经执行者审核后才可进入选段/字幕/总装流程。
# 落点：src/core/asr_review_gate.py，挂载于 AsrContextVerifier.verify_and_correct。
# 任何识别方案（Faster-Whisper / 其他 ASR）产出的segments 都要过这一关。
asr_review:
  max_seg_sec: 30.0          # 单段最长时长，超出记 WARN（切分异常）
  min_density: 0.06          # 识别密度下限（句/秒），低于此判 BLOCK
                              # 防"只转出 15 句"类转录退化（提示词复读循环）
  overlap_tolerance_sec: 0.5  # 相邻段重叠容差，超出记 WARN
  duration_tolerance_sec: 2.0  # end 超出媒体时长的容差
  warn_ratio_limit: 0.35     # WARN 占比超此比例自动升级为 BLOCK（防带病放行）
  # 2026-10-30 新增 A11：字形审计（残留繁体即拦截，防繁体字幕烧录）
  traditional_block: true
  cjk_min_ratio: 0.55        # 中文字符占比下限，低于记 WARN（疑似乱码）
  repeat_run_len: 5          # 连续重复字符阈值（"啊啊啊啊"判为噪声串）
  # 2026-11-01：噪声句处理策略——个别噪声句**丢弃**而非阻断整个任务；
  # 丢弃占比超此上限才判"系统性转录退化"并 BLOCK。
  # 实测：6 段素材里 2 句口吃曾让整个 17 分钟任务被 A2_REPEAT_RUN 阻断。
  drop_ratio_limit: 0.30

# ============ 字幕禁用错词（ASR 同音错字黑名单，QC 断言）============
subtitle_banned_tokens:
  - "食物还要"
  - "半导棉"
  - "瘦眉了"
  - "超选瘦"
  - "卡马去拍"
  - "歪歪DS"
  - "罗恩梯"

# ============ 选段黑名单（库存/促销/换款离场）============
# 默认正则在 src/tools/build_plan.py（INVENTORY_PATTERNS / CHANGEOVER_PATTERNS），
# 可在此处整体覆盖（列表形式，每条一个正则）以便不改代码即调参。
# 2026-10-21 精度修正：删除会误杀穿搭/面料/版型内容的模式
#   （牛仔/拍了/自己买/价格/偏薄/款型/来看这个/我特意），收紧 主播/撤。
blacklist:
  inventory: []      # 空 = 使用代码内置默认
  changover: []      # 空 = 使用代码内置默认


# ============ 切片间转场（2026-10-27 新增，反馈驱动）============
# 解决切片间语言与语音过渡不自然：视频 xfade 叠化 + 音频 acrossfade 交叉淡化。
# 配合 build_plan 的句子边界对齐（cut 点吸附标点），保证语言完整、听感连续。
transition_effect:
  enabled: true
  type: fade                    # fade（叠化）| none（硬切，旧行为）
  duration_sec: 0.25            # 转场时长（秒）；总时长按 N-1 个转场扣减
  audio_crossfade: true         # 音频同步交叉淡化（acrossfade）

# ============ 放大镜圆圈细节展示（2026-10-27 新增，反馈驱动）============
# 面料/做工分镜的人像 torso 区域叠加圆形放大镜：镜内显示 zoom 倍率的内容，
# 主画面保持完整构图。锚点由 agent_director 用 Pose 关键点计算并写入 plan。
magnifier_effect:
  enabled: true
  zoom: 1.8                     # 镜内放大倍率（1.5~2.2）
  radius: 130                   # 圆圈半径（px）
  ring_width: 8                 # 金属环宽（px）
  ring_color: "#E8A91E"         # 金色环（与封面商品名呼应）
  margin_x: 60                  # 锚点失效时的兜底位置：距右边缘
  anchor_y_ratio: 0.42          # 锚点失效时的兜底位置：画幅高度比例
  fade_in_sec: 0.35             # 出现/消失淡变
  hold_ratio: 0.80              # 停留占分镜时长比例
  delay_ratio: 0.12             # 分镜内延迟启动比例
  max_per_video: 2              # 每条成片最多放大镜数量（避免特效过载）
  require_face_clear: true      # 圆圈不得覆盖面部（与 overlay_face_safety 联动）

# ============ 全片头尾淡入淡出（2026-10-27 新增）============
fade_effect:
  enabled: true
  fade_in_sec: 0.3              # 片头黑场淡入
  fade_out_sec: 0.3             # 片尾淡出

# ============ 违规词库与处理（2026-10-27 新增，反馈驱动）============
# 词库来源：飞书《违规整合》（抖音电商学习中心极限词清单），
# 本地镜像 contracts/violation_words.yaml（可用 manage_violation_words.py 导入更新）。
# 三通道处理（决策）：字幕屏蔽 + 语音消音 + 视频打码，确保零残留。
# ============ ASR 字形归一（2026-10-30 新增，反馈驱动）============
# 背景：faster-whisper 的 zh 词表含港台繁体，褲/個/類/麼/嗎/覺 等字概率性输出繁体；
#       language=zh 不约束字形，initial_prompt 因吞音回归已默认关闭。
# 方案：确定性 t2s（OpenCC 词组级，幂等、时间戳守恒）+ A11 门禁 + 商品术语校验。
asr_script_normalization:
  enabled: true
  converter: opencc           # opencc（词组级，推荐）| builtin（内置字表兜底）
  protect_terms:              # 归一后校验术语写法（缺失仅告警）
    - "桑蚕丝"
    - "羊绒"
    - "羊毛"
    - "针织衫"
    - "渐变"

violation_words:
  library_path: "contracts/violation_words.yaml"
  detect:
    asr_segments: true          # ASR 台词全量扫描（语音消音依据）
    subtitles: true             # 成片字幕扫描（字幕屏蔽依据）
    cover_ocr: true             # 封面/画面文字 OCR 扫描（视频打码依据）
    scan_frames: 6              # 视频打码通道的抽帧数（每分镜）
  # 2026-10-30 用户明确：真实违禁词只从字幕里删掉（不显示即可），
  # 声音继续、画面不打码。以下默认值即为该策略。
  handling:
    subtitle_action: delete     # 字幕动作：delete（删除词）| mask（替换 ***）
    subtitle_mask: true         # 兼容旧键：true 时按 subtitle_action 执行
    audio_mute: false           # 通道 2 默认关闭（声音继续）
    video_mosaic: false         # 通道 3 默认关闭（画面不打码）
    mosaic_pad_px: 24           # 打码外扩像素（开启通道 3 时生效）
    mute_fade_ms: 80            # 消音淡变时长 ms（开启通道 2 时生效）
  # 判定：由 agent 工具复核（流水线只产出 violation_review_request.json，
  # agent 审阅后回写 violation_decisions.json；流水线不内置 LLM、不依赖 API Key）
  review:
    enabled: true
    max_candidates: 40          # 单次复核候选上限（超出走兜底）
    fallback_hard_categories:   # LLM 不可用兜底：仅这两类删字幕
      - medical_claim
      - false_absolutism
  enforce_level: BLOCK          # BLOCK=判定清单内检出即拦截；WARN=仅记录

# ============ 叠加层人脸安全审核（2026-10-27 新增，反馈驱动）============
# 贴纸/Hook卡/字幕带/放大镜等叠加元素不得遮挡模特面部（尤其是眼睛区域）。
# 审核在 QC 阶段对成片抽帧 + 叠加元素 meta 做几何交叠判定。
overlay_face_safety:
  enabled: true
  margin_px: 30                 # 叠加元素 bbox 与人脸 bbox 的最小间距
  sample_per_clip: 2            # 每个分镜抽帧数（叠加元素活跃时段内）
  enforce_level: BLOCK          # 压脸即拦截（反馈明确要求）

# ============ 素材-契约一致性预检（2026-10-27 新增，反馈驱动）============
# 2026-10-26 教训：素材实拍为马甲而契约为针织衫，导致成片口播与封面商品不符
# （抖音"虚假宣传-商品信息不一致"违规）。预检在 Phase 1.5 执行：
#   ASR 关键词覆盖率 = 规范关键词在主播台词中的命中情况；
#   商品名词覆盖率 = 契约商品名核心词在台词中的命中情况。
consistency_check:
  enabled: true
  keyword_coverage_warn: 0.34   # 规范关键词覆盖率低于此值记 WARN
  product_word_warn: 0.5        # 商品名核心词覆盖率低于此值记 WARN
  garment_match_warn: 0.15      # 衣着一致性低于此值记 WARN（与 garment_match.histogram_min 对齐）
  enforce_level: WARN           # 默认 WARN（不拦截）；确认错配时可升 BLOCK
  report_path: "consistency_report.json"


# ============ 成片 ASR 复检门禁（2026-10-27 新增，闭环"物理咬合原声"承诺）============
# 背景：原工作流对素材 ASR 有三重校验（asr_review_gate / asr_agent_verifier /
# consistency_check），但对**拼接后完整视频**没有任何 ASR 复检——QC 的字词检查
# 只是 ASS 文件级文本检查，无法验证：①字幕与成片原声是否一致 ②语音消音是否
# 真的生效 ③xfade/acrossfade 转场是否损坏语音 ④价格/违规词是否在音频通道残留。
# 本段配置 verify_final_video_asr 工具 + QC 的 _audit_final_video_asr 断言。
final_asr_verify:
  enabled: true
  model_size: small              # 复检模型（与转写同规模，保证可比性）
  # V1 字幕-原声一致性（difflib 全局相似度）
  subtitle_match_block: 0.50     # < 此值 BLOCK（字幕与原声严重不符）
  subtitle_match_warn: 0.70      # < 此值 WARN
  # V4 识别密度（句/秒，防组装吞音）
  density_min: 0.06
  # V5 消音执行核查：消音窗口内最大音量超过此值 → BLOCK（词仍可听见）
  mute_max_volume_db: -30.0
  # V2/V3 语音通道价格/违规词：检出即 BLOCK（enforce_level 控制）
  enforce_level: BLOCK


# ============ 商品图封面适配器（2026-10-28 新增，可复用方案）============
# 问题：商品图（尤其带深色边缘的实拍缩略图）直接作封面/封面大图时边缘生硬
# （"贴纸感"）。方案：背景延展 / 边缘羽化 / 渐变融合 / 阴影 / 圆角，全参数可配。
# 模块：src/graphics/product_image_adapter.py（核心）
#       src/tools/adapt_product_cover.py（CLI）
#       src/tools/verify_cover_adaptation.py（效果验证）
# 模式：card（圆角卡片+阴影，兼容旧贴图）| blend（柔边融入纯色/渐变背景，推荐）
#       extend（商品图色彩延展为全幅背景+主体柔边居中）| collage（大图重羽化拼贴）
product_image_adapter:
  mode: blend                    # card | blend | extend | collage
  canvas_size: [1080, 1920]      # 默认输出画布
  # 尺寸与留白
  margin_px: 96                  # 商品图四周留白
  scale_mode: fit                # fit | fill | stretch
  max_subject_ratio: 0.72        # 商品图主体占画布短边比例上限
  # 边缘样式
  edge_style: gradient           # gradient（渐变融合）| hard | rounded
  corner_radius: 28              # 圆角半径 px（0=直角）
  feather_px: 48                 # 边缘羽化宽度 px
  blend_ratio: 1.0               # 渐变融合强度 0~1
  dehalo: true                   # 边缘去晕（深色商品图贴浅背景的脏边清除）
  dehalo_blur_ratio: 0.5         # 去晕模糊半径 = feather_px × 此比例
  # 阴影
  shadow:
    enabled: true
    blur: 24
    offset_x: 0
    offset_y: 10
    alpha: 90
    color: "#1A0D07"
  # 背景
  background:
    type: gradient               # color | gradient | extend
    color: "#F5EFE8"
    gradient: ["#F5EFE8", "#E8D9C8"]
    extend_method: mirror        # mirror | replicate
    extend_scale: 1.25           # 延展放大系数
    extend_blur: 60              # 延展背景模糊半径 px
    darken: 0.12                 # 延展背景压暗（文字可读性）
    saturate: 1.05
  # collage 模式
  collage:
    subject_ratio: 0.88
    feather_px: 90
    rotate_deg: 0.0
