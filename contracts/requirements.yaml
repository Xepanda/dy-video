# 既定需求基线（Requirements Baseline）v1.0
# ============================================================
# 目的：把散落在文档里的"既定需求"抽取为**可机器复核**的结构化清单，
#       使"是否满足"从人工判断变成自动判据。
#
# 来源（需求原文出处）：
#   [PLAN]  docs/editing_task_plan_2026-10-21.md   —— 需求编号表 + 字幕校对流水线
#   [SKILL] skills/live-ecommerce-video-editor/SKILL.md —— 7 大节制作规范
#   [CON]   contracts/constraints.yaml + contracts/constraints_map.md —— 量化约束
#
# 字段说明：
#   id            需求编号（R-xxx）
#   source        需求原文出处 + 章节
#   title         需求摘要
#   level         约束级别：BLOCK（不满足即失败）/ WARN（提示）/ INFO（登记）
#   status        实现状态：implemented / partial / unimplemented
#   constraint_keys   证据锚点 ①：constraints.yaml 键路径（应存在且被消费）
#   qc_assertions     证据锚点 ②：qc_auditor.py 中的断言名（应存在）
#   code_symbols      证据锚点 ③：代码符号（函数/类名，应存在）
#   allow_dead    true 表示该锚点允许"yaml 有键但无消费者"（仅登记需求）
#   note          补充说明（偏离、冲突、待决策项）
#
# 校验方式：
#   python -u src/tools/audit_requirements.py          # 逐条核对 + 死键清单
#   python -u tests/test_requirements_audit.py         # 单元测试（回归层）
#
# 规则：任何一条 status 与实测不符 → 测试失败。
#       这就是"阈值只改本文件"与"声明即实现"两条纪律的机器化守卫。

